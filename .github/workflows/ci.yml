name: Regression and workbench delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Fresh import
        run: python -m finevidence import aurora_2024.json harbor_2024.json
      - name: Structured evidence smoke
        run: python -m finevidence query "revenue" --company "Aurora Orchard" --year 2024 --top-k 1 --json
      - name: Source-linked synthetic calculation smoke
        run: python -m finevidence calculate gross-margin --company "Aurora Orchard" --year 2024 --json
      - name: Import prior-year fixtures
        run: python -m finevidence import aurora_2023.json harbor_2023.json
      - name: Source-linked annual growth smoke
        run: python -m finevidence calculate revenue-growth --company "Aurora Orchard" --year 2024 --json
      - name: Source-linked margin percentage-point smoke
        run: python -m finevidence calculate gross-margin-change --company "Aurora Orchard" --year 2024 --json
      - name: Build synthetic fact snapshot
        run: python -m finevidence build-facts --json
      - name: Read-only SQLite calculation smoke
        run: python -m finevidence calculate gross-margin-change --company "Aurora Orchard" --year 2024 --fact-store sqlite --json

      - name: Synthetic task evaluation (no model credentials)
        run: python scripts/evaluate.py --output /tmp/finevidence-evaluation.json

      - name: Absolute request-body deadlines (synthetic loopback, no model)
        run: python scripts/evaluate_request_body.py --output /tmp/finevidence-body-evaluation.json

      - name: Offline TLS deadlines including default and remaining Agent budgets
        run: python scripts/evaluate_provider_deadline.py --output /tmp/finevidence-deadline-evaluation.json

      - name: Worker deadlines survive server exit (synthetic HTTP and TLS)
        run: python scripts/evaluate_provider_exit.py --output /tmp/finevidence-exit-evaluation.json

      - name: Known-defect store recovery evaluation (synthetic, no model)
        run: python scripts/evaluate_review_store.py --output /tmp/finevidence-store-evaluation.json

      - name: Non-regular review store startup (synthetic, bounded subprocesses)
        run: python scripts/evaluate_review_path.py --output /tmp/finevidence-path-evaluation.json

      - name: Interrupted review transaction recovery (synthetic, no model)
        run: python scripts/evaluate_review_recovery.py --output /tmp/finevidence-crash-recovery.json

      - name: Browser corpus and Python parity oracles
        run: python scripts/build_web.py
      - name: Replay corruption evaluation (synthetic, no model)
        run: node scripts/evaluate_replay.mjs
      - name: Deterministic browser engine, draft and handoff tests
        run: node --test tests/*.test.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: exit-evaluation-${{ matrix.os }}
          path: /tmp/finevidence-exit-evaluation.json
          if-no-files-found: warn

  browser:
    needs: test
    runs-on: ubuntu-latest
    # d1f90d1 took 19m25s (8m16s dependency installation). Reserve CI setup
    # margin; application and individual test deadlines remain unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: python scripts/build_web.py
      - name: Local review ledger with synthetic operators and durable restart
        run: pnpm test:review-ledger
      - name: Local review failures retain phases and redacted diagnostics
        run: pnpm test:review-report
      - name: Opaque source filenames through local review receipts
        run: pnpm test:review-filename
      - name: Correct rejected observations and preserve unknown-outcome request IDs
        run: pnpm test:review-correction
      - name: Recovered review history and exports at desktop and narrow widths
        run: pnpm test:review-recovery
      - name: Startup wait predicates with delayed DOM and negative controls
        run: pnpm test:waits
      - name: Public static workbench workflow
        run: |
          python -m http.server 8776 --bind 127.0.0.1 --directory web > /tmp/finevidence-web.log 2>&1 &
          BASE_URL=http://127.0.0.1:8776/ pnpm test:browser
      - name: Local Python workbench workflow
        run: |
          python -m finevidence.server > /tmp/finevidence-api.log 2>&1 &
          BROWSER_ARTIFACTS=browser-artifacts/python pnpm test:browser
          BROWSER_ARTIFACTS=browser-artifacts/python pnpm test:restore
      - name: Restoration failures retain exact navigation phases and checkpoints
        run: BROWSER_ARTIFACTS=browser-artifacts/python pnpm test:restore-report
      - name: Failing browser suite retains diagnostic evidence
        run: pnpm test:browser-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: browser-artifacts

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: finevidence-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/build_web.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
